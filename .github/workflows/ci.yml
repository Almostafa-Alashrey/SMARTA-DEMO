name: SMARTA CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Create Mock .env file
      run: |
        echo "BACKEND_URL=http://localhost:8000" > .env
        # لو في أي متغيرات بيئة (Environment Variables) الداتا بيز أو الباك إند بيحتاجها حطها هنا

    - name: Build and start containers
      run: docker compose up -d --build

    - name: Check running containers
      run: docker ps -a

    - name: Test Backend API Health
      run: |
        echo "Waiting 30 seconds for backend and AI models to initialize..."
        sleep 30
        curl -f http://localhost:8000/docs || (docker compose logs && exit 1)

    - name: Shut down containers
      if: always()
      run: docker compose down